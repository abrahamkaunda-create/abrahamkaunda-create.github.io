<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">Windows Active Directory lab topology</title>
  <desc id="desc">An isolated VMware host-only network connects domain controller DC01 at 192.168.50.10 to Windows client CLIENT01 at 192.168.50.20. DC01 provides Active Directory, DNS and the Finance file share for the corp.local domain.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6 0 12Z" fill="#d6ff3f"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#d6ff3f"/>
    </filter>
  </defs>

  <rect width="1440" height="800" fill="#101c2b"/>
  <rect width="1440" height="800" fill="url(#grid)"/>
  <text x="72" y="74" fill="#d6ff3f" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="4">ISOLATED VMWARE LAB</text>
  <text x="72" y="116" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="500">corp.local</text>
  <text x="1368" y="78" fill="#b9c2cb" font-family="monospace" font-size="17" text-anchor="end">192.168.50.0/24 · HOST-ONLY · NO GATEWAY</text>

  <rect x="72" y="172" width="1296" height="520" rx="4" fill="#173e64" stroke="#7990a4" stroke-width="2"/>
  <text x="104" y="215" fill="#b9c2cb" font-family="monospace" font-size="15">VMWARE HOST-ONLY NETWORK</text>

  <path d="M525 416H889" stroke="#d6ff3f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M889 448H525" stroke="#ffffff" stroke-opacity=".65" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="706" y="390" fill="#d6ff3f" font-family="monospace" font-size="15" text-anchor="middle">DNS · DOMAIN AUTH · GPO · SMB</text>

  <g filter="url(#shadow)">
    <rect x="126" y="270" width="400" height="300" fill="#f4f1e9" stroke="#101c2b" stroke-width="3"/>
  </g>
  <rect x="158" y="302" width="84" height="84" fill="#101c2b"/>
  <rect x="178" y="322" width="44" height="7" fill="#d6ff3f"/>
  <rect x="178" y="342" width="44" height="7" fill="#d6ff3f"/>
  <circle cx="200" cy="370" r="5" fill="#d6ff3f"/>
  <text x="274" y="330" fill="#101c2b" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">DOMAIN CONTROLLER</text>
  <text x="158" y="438" fill="#101c2b" font-family="Arial, sans-serif" font-size="48" font-weight="600">DC01</text>
  <text x="158" y="480" fill="#425467" font-family="monospace" font-size="18">192.168.50.10</text>
  <text x="158" y="523" fill="#425467" font-family="Arial, sans-serif" font-size="17">Windows Server 2025</text>
  <text x="158" y="550" fill="#425467" font-family="Arial, sans-serif" font-size="17">AD DS · DNS · \\DC01\Finance</text>

  <g filter="url(#shadow)">
    <rect x="892" y="270" width="400" height="300" fill="#f4f1e9" stroke="#101c2b" stroke-width="3"/>
  </g>
  <rect x="924" y="302" width="112" height="72" fill="#101c2b"/>
  <rect x="936" y="314" width="88" height="48" fill="#173e64" stroke="#d6ff3f"/>
  <path d="M966 384h28l12 14h-52z" fill="#101c2b"/>
  <text x="1062" y="330" fill="#101c2b" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">DOMAIN CLIENT</text>
  <text x="924" y="438" fill="#101c2b" font-family="Arial, sans-serif" font-size="48" font-weight="600">CLIENT01</text>
  <text x="924" y="480" fill="#425467" font-family="monospace" font-size="18">192.168.50.20 · DNS 192.168.50.10</text>
  <text x="924" y="523" fill="#425467" font-family="Arial, sans-serif" font-size="17">Windows 11 Enterprise Evaluation</text>
  <text x="924" y="550" fill="#425467" font-family="Arial, sans-serif" font-size="17">Domain joined · Corp\Computers OU</text>

  <g font-family="monospace" font-size="15">
    <rect x="72" y="724" width="305" height="42" fill="#d6ff3f"/>
    <text x="94" y="751" fill="#101c2b">01 / ACTIVE DIRECTORY + DNS</text>
    <rect x="398" y="724" width="252" height="42" fill="none" stroke="#7990a4"/>
    <text x="420" y="751" fill="#ffffff">02 / GROUP POLICY</text>
    <rect x="671" y="724" width="306" height="42" fill="none" stroke="#7990a4"/>
    <text x="693" y="751" fill="#ffffff">03 / SMB + NTFS ACCESS</text>
    <rect x="998" y="724" width="370" height="42" fill="none" stroke="#7990a4"/>
    <text x="1020" y="751" fill="#ffffff">04 / POWERSHELL + SUPPORT</text>
  </g>
</svg>
